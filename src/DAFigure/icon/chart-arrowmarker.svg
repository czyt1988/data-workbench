<?xml version="1.0" encoding="utf-8"?>
<!-- 箭头标记（QwtPlotArrowMarker）：一端圆点、一端主蓝箭头的注释箭头，用于在图上标注方向。
     官方色板：#727272、#497CAD；64×64 画布；禁渐变/阴影/<text>（DESIGN.md §4） -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
	<line x1="14" y1="50" x2="41" y2="23" stroke="#727272" stroke-width="4" stroke-linecap="round"/>
	<polygon points="52,12 46,29 35,18" fill="#497CAD" stroke="#497CAD" stroke-width="1" stroke-linejoin="round"/>
	<circle cx="14" cy="50" r="3.5" fill="#727272"/>
</svg>
