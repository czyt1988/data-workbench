<?xml version="1.0" encoding="utf-8"?>
<!-- 刻度项（QwtPlotScaleItem）：绘图区内部的浅蓝刻度带 + 深蓝刻度线与刻度短线，
     表示放在画布内部的附加坐标刻度。官方色板：#727272、#BDCDE8、#497CAD、#FFFFFF；
     64×64 画布；禁渐变/阴影/<text>（DESIGN.md §4） -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
	<path d="M10 56V8M10 56H56" fill="none" stroke="#727272" stroke-width="2.5"
	      stroke-linecap="round" stroke-linejoin="round"/>
	<rect x="28" y="8" width="20" height="44" fill="#BDCDE8"/>
	<line x1="32" y1="8" x2="32" y2="52" stroke="#497CAD" stroke-width="3.5"/>
	<g stroke="#497CAD" stroke-width="2.5" stroke-linecap="round">
		<line x1="32" y1="14" x2="44" y2="14"/>
		<line x1="32" y1="26" x2="44" y2="26"/>
		<line x1="32" y1="38" x2="44" y2="38"/>
		<line x1="32" y1="50" x2="44" y2="50"/>
	</g>
</svg>
