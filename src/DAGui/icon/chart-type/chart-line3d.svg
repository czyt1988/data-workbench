<?xml version="1.0" encoding="utf-8"?>
<!-- 3D 折线图：透视立方框 + 两条不同形态的折线（橙红/深蓝），体现第三维上的多条曲线。
     图表系列取色池与轴线灰见 DESIGN.md §4.2.3；64×64 固定画布 -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
	<!-- 透视立方框 -->
	<g fill="none" stroke="#B2B2B2" stroke-width="1.4" stroke-linejoin="round">
		<path d="M10 54H54V14H10Z"/>
		<path d="M16 48H60V8H16Z"/>
		<path d="M10 54l6-6M54 54l6-6M54 14l6-6M10 14l6-6"/>
	</g>
	<!-- 系列 1（橙红） -->
	<polyline points="12,46 20,38 28,30 36,24 44,16 52,12" fill="none" stroke="#CE6043"
	          stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
	<g fill="#CE6043">
		<circle cx="12" cy="46" r="1.7"/>
		<circle cx="20" cy="38" r="1.7"/>
		<circle cx="28" cy="30" r="1.7"/>
		<circle cx="36" cy="24" r="1.7"/>
		<circle cx="44" cy="16" r="1.7"/>
		<circle cx="52" cy="12" r="1.7"/>
	</g>
	<!-- 系列 2（深蓝） -->
	<polyline points="18,42 26,34 34,22 42,30 50,20" fill="none" stroke="#497CAD"
	          stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
	<g fill="#497CAD">
		<circle cx="18" cy="42" r="1.7"/>
		<circle cx="26" cy="34" r="1.7"/>
		<circle cx="34" cy="22" r="1.7"/>
		<circle cx="42" cy="30" r="1.7"/>
		<circle cx="50" cy="20" r="1.7"/>
	</g>
</svg>
