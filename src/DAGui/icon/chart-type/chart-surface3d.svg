<?xml version="1.0" encoding="utf-8"?>
<!-- 3D 曲面图：透视坐标轴 + 带网格的曲面片（浅蓝面 + 深蓝网格线），读取为三维曲面。
     图表系列取色池与轴线灰见 DESIGN.md §4.2.3；64×64 固定画布 -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
	<!-- 透视坐标轴 -->
	<path d="M8 56V10M8 56H60M8 56L20 44" fill="none" stroke="#727272" stroke-width="2"
	      stroke-linecap="round" stroke-linejoin="round"/>
	<!-- 曲面片 -->
	<path d="M14 42L28 24H56L42 42Z" fill="#BDCDE8"/>
	<!-- 曲面网格 -->
	<g fill="none" stroke="#497CAD" stroke-width="1.2">
		<path d="M18.6 36H46.6"/>
		<path d="M23.2 30H51.2"/>
		<path d="M21 42L35 24"/>
		<path d="M28 42L42 24"/>
		<path d="M35 42L49 24"/>
	</g>
	<!-- 曲面轮廓 -->
	<path d="M14 42L28 24H56L42 42Z" fill="none" stroke="#497CAD" stroke-width="2" stroke-linejoin="round"/>
</svg>
