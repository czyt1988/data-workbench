<?xml version="1.0" encoding="utf-8"?>
<!-- 撤销历史：时钟表盘（中灰圈 + 白底 + 深蓝指针）+ 外侧逆时针回退箭头（主蓝）。
     弧线拆成 4 段小圆弧，避免大弧标志在两个候选圆心间选到画布外。
     语义对应「显示撤销历史」动作。官方色板：#727272、#497CAD、#5280C1、#FFFFFF；
     禁渐变/阴影/文字元素（DESIGN.md §4） -->
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
	<!-- 表盘 -->
	<circle cx="100" cy="100" r="54" fill="#FFFFFF" stroke="#727272" stroke-width="12"/>
	<!-- 时针/分针 -->
	<path d="M100 100V52M100 100L136 122" fill="none" stroke="#497CAD" stroke-width="10"
	      stroke-linecap="round"/>
	<!-- 逆时针回退箭头（300° 圆弧） -->
	<path d="M100 22A78 78 0 0 0 22 100A78 78 0 0 0 100 178A78 78 0 0 0 178 100A78 78 0 0 0 167.6 61"
	      fill="none" stroke="#5280C1" stroke-width="12" stroke-linecap="round"/>
	<polygon points="157.6,43.7 178.8,54.5 156.3,67.5" fill="#5280C1"/>
</svg>
