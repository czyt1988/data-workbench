	<rect x="30" y="34" width="66" height="132" fill="#FFFFFF"/>
	<rect x="30" y="34" width="66" height="44" fill="#BDCDE8"/>
	<g fill="none" stroke="#727272" stroke-width="8" stroke-linecap="butt">
		<rect x="30" y="34" width="66" height="132"/>
		<line x1="30" y1="78" x2="96" y2="78"/>
		<line x1="30" y1="122" x2="96" y2="122"/>
	</g>
	<path d="M 146 46 V 116" fill="none" stroke="#5280C1" stroke-width="14" stroke-linecap="butt"/>
	<polygon points="120,110 172,110 146,152" fill="#5280C1"/>
