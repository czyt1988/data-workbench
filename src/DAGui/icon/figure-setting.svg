<?xml version="1.0" encoding="utf-8"?>
<!-- 图表区设置：带坐标轴的图表面板（柱 + 折线），语义为设置项「图表区」。
     线宽与同目录图标统一为 8~10。官方色板：#727272、#5280C1、#BDCDE8、#FFFFFF；
     禁渐变/阴影/<text>（DESIGN.md §4） -->
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
	<!-- 面板 -->
	<rect x="14" y="18" width="172" height="164" rx="10" fill="#FFFFFF" stroke="#727272" stroke-width="10"/>
	<!-- 坐标轴 -->
	<path d="M40 158V44H164" fill="none" stroke="#727272" stroke-width="8" stroke-linecap="round"/>
	<!-- 柱 -->
	<rect x="58" y="112" width="24" height="46" fill="#BDCDE8"/>
	<rect x="92" y="92" width="24" height="66" fill="#BDCDE8"/>
	<rect x="126" y="122" width="24" height="36" fill="#BDCDE8"/>
	<!-- 折线 -->
	<path d="M52 100L82 74L110 88L148 52" fill="none" stroke="#5280C1" stroke-width="10"
	      stroke-linecap="round" stroke-linejoin="round"/>
</svg>
