<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" x="0px" y="0px"
	 width="200px" height="200px" viewBox="0 0 200 200" xml:space="preserve">
	<!-- 宽转长（melt）：左侧宽表（三列网格）→ 主蓝箭头 → 右侧窄长表（浅蓝填充，多行）。
	     官方色板：轮廓 #727272（中灰）、宽表底 #FFFFFF、长表填充 #BDCDE8（浅蓝）、
	     箭头 #5280C1（主蓝，主操作）；禁渐变/阴影/<text>（DESIGN.md §4） -->
	<rect x="14" y="55" width="84" height="90" fill="#FFFFFF"/>
	<g fill="none" stroke="#727272" stroke-width="7" stroke-linecap="butt">
		<rect x="14" y="55" width="84" height="90"/>
		<line x1="42" y1="55" x2="42" y2="145"/>
		<line x1="70" y1="55" x2="70" y2="145"/>
		<line x1="14" y1="85" x2="98" y2="85"/>
		<line x1="14" y1="115" x2="98" y2="115"/>
	</g>
	<path d="M 106 100 H 128" fill="none" stroke="#5280C1" stroke-width="10" stroke-linecap="butt"/>
	<polygon points="126,86 126,114 148,100" fill="#5280C1"/>
	<rect x="156" y="25" width="34" height="150" fill="#BDCDE8"/>
	<g fill="none" stroke="#727272" stroke-width="7" stroke-linecap="butt">
		<rect x="156" y="25" width="34" height="150"/>
		<line x1="156" y1="62" x2="190" y2="62"/>
		<line x1="156" y1="100" x2="190" y2="100"/>
		<line x1="156" y1="137" x2="190" y2="137"/>
	</g>
</svg>
