<?xml version="1.0" encoding="utf-8"?>
<!-- 序列填充：基线 + 左侧源值格（浅蓝）+ 主蓝箭头 + 右侧递增的三格序列（浅蓝，顶边主蓝）。
     语义对应「序列填充...」菜单项。官方色板：#727272、#5280C1、#BDCDE8、#FFFFFF；
     禁渐变/阴影/<text>（DESIGN.md §4） -->
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
	<!-- 基线 -->
	<rect x="16" y="150" width="168" height="10" fill="#727272"/>
	<!-- 源值格 -->
	<rect x="22" y="100" width="36" height="50" fill="#BDCDE8"/>
	<!-- 生成箭头 -->
	<line x1="64" y1="125" x2="88" y2="125" stroke="#5280C1" stroke-width="12"/>
	<polygon points="86,109 112,125 86,141" fill="#5280C1"/>
	<!-- 递增序列 -->
	<rect x="118" y="120" width="20" height="30" fill="#BDCDE8"/>
	<rect x="118" y="120" width="20" height="6" fill="#5280C1"/>
	<rect x="144" y="98" width="20" height="52" fill="#BDCDE8"/>
	<rect x="144" y="98" width="20" height="6" fill="#5280C1"/>
	<rect x="170" y="76" width="20" height="74" fill="#BDCDE8"/>
	<rect x="170" y="76" width="20" height="6" fill="#5280C1"/>
</svg>
