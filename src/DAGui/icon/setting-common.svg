<?xml version="1.0" encoding="utf-8"?>
<!-- 通用设置：齿轮（深蓝实心 + 白色轴孔）。用于设置页「通用」入口，
     1024 画布「深蓝实心 + 白色镂空」风格。官方色板：#497CAD、#FFFFFF -->
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 1024 1024">
	<g fill="#497CAD">
		<rect x="462" y="48" width="100" height="180" rx="26"/>
		<rect x="462" y="48" width="100" height="180" rx="26" transform="rotate(45 512 512)"/>
		<rect x="462" y="48" width="100" height="180" rx="26" transform="rotate(90 512 512)"/>
		<rect x="462" y="48" width="100" height="180" rx="26" transform="rotate(135 512 512)"/>
		<rect x="462" y="48" width="100" height="180" rx="26" transform="rotate(180 512 512)"/>
		<rect x="462" y="48" width="100" height="180" rx="26" transform="rotate(225 512 512)"/>
		<rect x="462" y="48" width="100" height="180" rx="26" transform="rotate(270 512 512)"/>
		<rect x="462" y="48" width="100" height="180" rx="26" transform="rotate(315 512 512)"/>
		<circle cx="512" cy="512" r="300"/>
	</g>
	<circle cx="512" cy="512" r="120" fill="#FFFFFF"/>
</svg>
