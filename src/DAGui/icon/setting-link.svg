<?xml version="1.0" encoding="utf-8"?>
<!-- 连接项设置：两端节点（深蓝实心圆 + 白色端口）由粗连线相连，表示节点间连线。
     用于工作流节点「Link」设置页。1024 画布「深蓝实心 + 白色镂空」风格。
     官方色板：#497CAD、#FFFFFF -->
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 1024 1024">
	<rect x="250" y="462" width="524" height="100" rx="50" fill="#497CAD"/>
	<circle cx="260" cy="512" r="130" fill="#497CAD"/>
	<circle cx="764" cy="512" r="130" fill="#497CAD"/>
	<circle cx="260" cy="512" r="40" fill="#FFFFFF"/>
	<circle cx="764" cy="512" r="40" fill="#FFFFFF"/>
</svg>
