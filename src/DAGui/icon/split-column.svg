<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" x="0px" y="0px"
	 width="200px" height="200px" viewBox="0 0 200 200" xml:space="preserve">
	<!-- 分列：左侧源列（白底灰框 + 浅灰数据行）→ 主蓝箭头 → 右侧三个浅蓝结果列。
	     官方色板：轮廓 #727272（中灰）、源列底 #FFFFFF、数据行 #B2B2B2（浅灰）、
	     箭头 #5280C1（主蓝，主操作）、结果列 #BDCDE8（浅蓝）；禁渐变/阴影/<text>（DESIGN.md §4） -->
	<rect x="20" y="30" width="46" height="140" fill="#FFFFFF"/>
	<rect x="31" y="52" width="24" height="10" fill="#B2B2B2"/>
	<rect x="31" y="78" width="24" height="10" fill="#B2B2B2"/>
	<rect x="31" y="104" width="24" height="10" fill="#B2B2B2"/>
	<rect x="31" y="130" width="24" height="10" fill="#B2B2B2"/>
	<rect x="20" y="30" width="46" height="140" fill="none" stroke="#727272" stroke-width="8"/>
	<path d="M 78 100 H 106" fill="none" stroke="#5280C1" stroke-width="10" stroke-linecap="butt"/>
	<polygon points="104,86 104,114 126,100" fill="#5280C1"/>
	<rect x="138" y="30" width="14" height="140" fill="#BDCDE8" stroke="#727272" stroke-width="5"/>
	<rect x="158" y="30" width="14" height="140" fill="#BDCDE8" stroke="#727272" stroke-width="5"/>
	<rect x="178" y="30" width="14" height="140" fill="#BDCDE8" stroke="#727272" stroke-width="5"/>
</svg>
