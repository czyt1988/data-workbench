		<line x1="127" y1="20" x2="127" y2="180"/>
		<line x1="20" y1="73" x2="180" y2="73"/>
		<line x1="20" y1="127" x2="180" y2="127"/>
	</g>
	<path d="M 170 78 H 142 L 156 100 L 142 122 H 170"
