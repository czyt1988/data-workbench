<?xml version="1.0" encoding="utf-8"?>
<!-- 删除所有列：表格列头保留，全部列体标红（白色分隔线）+ 白色减号 + 右下橙红删除徽标。
     语义对应表头的「删除所有列」菜单项。官方色板：#CE6043、#BDCDE8、#727272、
     #FFFFFF；禁渐变/阴影/<text>（DESIGN.md §4） -->
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
	<!-- 表格 -->
	<rect x="24" y="36" width="152" height="128" rx="8" fill="#FFFFFF" stroke="#727272" stroke-width="10"/>
	<!-- 列头 -->
	<rect x="29" y="41" width="142" height="30" fill="#BDCDE8"/>
	<!-- 全部列体标红 -->
	<rect x="29" y="71" width="142" height="88" fill="#CE6043"/>
	<!-- 白色分隔线保留表格结构 -->
	<g stroke="#FFFFFF" stroke-width="6">
		<line x1="75" y1="71" x2="75" y2="159"/>
		<line x1="125" y1="71" x2="125" y2="159"/>
	</g>
	<!-- 删除标记 -->
	<rect x="68" y="111" width="56" height="10" rx="5" fill="#FFFFFF"/>
	<circle cx="160" cy="158" r="34" fill="#FFFFFF"/>
	<circle cx="160" cy="158" r="27" fill="#CE6043"/>
	<rect x="146" y="154" width="28" height="8" rx="4" fill="#FFFFFF"/>
</svg>
