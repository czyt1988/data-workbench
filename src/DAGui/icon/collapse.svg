<?xml version="1.0" encoding="utf-8"?>
<!-- 折叠全部：父节点（主蓝 + 白色减号）与下方淡化的子节点，表示子层级已折叠隐藏。
     用于数据管理树/图表管理树的「折叠全部」按钮。官方色板：#5280C1、#727272、
     #B2B2B2、#FFFFFF；禁渐变/阴影/<text>（DESIGN.md §4） -->
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
	<!-- 父子连接线 -->
	<path d="M100 74V96M44 96H156M44 96V116M156 96V116" fill="none" stroke="#727272"
	      stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
	<!-- 折叠状态的子节点（淡化） -->
	<rect x="16" y="116" width="56" height="48" rx="8" fill="#B2B2B2" fill-opacity="0.55"/>
	<rect x="128" y="116" width="56" height="48" rx="8" fill="#B2B2B2" fill-opacity="0.55"/>
	<!-- 父节点（已折叠） -->
	<rect x="60" y="18" width="80" height="56" rx="10" fill="#5280C1"/>
	<rect x="78" y="42" width="44" height="8" rx="4" fill="#FFFFFF"/>
</svg>
