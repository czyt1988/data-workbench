<?xml version="1.0" encoding="utf-8"?>
<!-- 放大：放大镜（中灰镜圈 + 白底）+ 绿色加号。与 zoomOut/chart-zoomer 共用同一镜身几何。
     语义对应 UiNames::Action::ChartZoomIn。官方色板：#727272、#669E8B、#FFFFFF；
     禁渐变/阴影/<text>（DESIGN.md §4） -->
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
	<!-- 镜身 -->
	<circle cx="84" cy="84" r="54" fill="#FFFFFF" stroke="#727272" stroke-width="12"/>
	<line x1="124" y1="124" x2="176" y2="176" stroke="#727272" stroke-width="14" stroke-linecap="round"/>
	<!-- 绿色加号 -->
	<path d="M54 84h60M84 54v60" fill="none" stroke="#669E8B" stroke-width="14" stroke-linecap="round"/>
</svg>
