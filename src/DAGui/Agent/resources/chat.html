<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="chat.css">
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <script src="markdown-it.min.js"></script>
    <script src="highlight.min.js"></script>
</head>
<body>
    <div id="messages"></div>

    <!-- 状态栏：状态文案（左）+ 模型选择器（左，紧贴状态文案）+ token 计量（右，可点弹明细） -->
    <div id="status-bar">
        <span id="status-text"></span>
        <!-- 两级模型选择器：点击触发按钮 → 第一层供应商列表 → 第二层模型列表 -->
        <div id="model-selector">
            <button id="model-trigger" type="button">
                <span id="model-trigger-text"></span>
                <svg class="model-trigger-chevron" viewBox="0 0 24 24" width="12" height="12" aria-hidden="true">
                    <path fill="currentColor" d="M7 10l5 5l5-5z"/>
                </svg>
            </button>
            <!-- 两级下拉面板（向上展开） -->
            <div id="model-dropdown" hidden></div>
        </div>
        <!-- 权限模式选择器：镜像模型选择器交互（permission-layer P1）。
             yolo/auto/manual 三档；切 yolo 首次需二次确认（JS 侧）。 -->
        <div id="mode-selector">
            <button id="mode-trigger" type="button">
                <span id="mode-trigger-text"></span>
                <svg class="mode-trigger-chevron" viewBox="0 0 24 24" width="12" height="12" aria-hidden="true">
                    <path fill="currentColor" d="M7 10l5 5l5-5z"/>
                </svg>
            </button>
            <!-- 单级下拉面板（向上展开） -->
            <div id="mode-dropdown" hidden></div>
        </div>
        <span id="token-label">tokens: -</span>
        <!-- token 分类明细浮层（点击 token-label 切换显隐） -->
        <div id="token-popover" hidden></div>
    </div>

    <!-- 输入区：多行输入框 + 发送/终止按钮 -->
    <div id="input-area">
        <textarea id="input-edit" rows="2"></textarea>
        <button id="send-btn" type="button">Send</button>
    </div>

    <script src="chat.js"></script>
</body>
</html>
