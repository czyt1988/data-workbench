<?xml version="1.0" encoding="utf-8"?>
<!-- 禁止水平缩放：水平双向箭头（主蓝）+ 禁止圈（橙红）。语义对应
     UiNames::Action::ChartDisableZoomX。官方色板：#5280C1、#CE6043、#FFFFFF；
     禁渐变/阴影/<text>（DESIGN.md §4） -->
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
	<!-- 水平双向箭头 -->
	<path fill="#5280C1" d="M52 106h96V88l44 38-44 38v-18H52v18L8 126l44-38z"/>
	<!-- 禁止圈：外圈 + 斜杠 -->
	<path fill="#CE6043" fill-rule="evenodd" d="M100 6a40 40 0 1 0 0 80 40 40 0 0 0 0-80zm0 14a26 26 0 1 1 0 52 26 26 0 0 1 0-52z"/>
	<rect x="65" y="39" width="70" height="14" rx="7" fill="#CE6043" transform="rotate(45 100 46)"/>
</svg>
