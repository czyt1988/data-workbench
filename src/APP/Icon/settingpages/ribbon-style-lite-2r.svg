<?xml version="1.0" encoding="utf-8"?>
<!-- Ribbon 样式预览：Lite（紧凑）两行。标题栏 + 标签栏 + 两个面板，
     每个面板一个较小的大按钮与两行小按钮。官方色板：#5D6D7E、#BDCDE8、
     #5280C1、#B2B2B2、#FFFFFF；禁渐变/阴影/<text>（DESIGN.md §4） -->
<svg xmlns="http://www.w3.org/2000/svg" width="240" height="62" viewBox="0 0 240 62">
	<rect x="1" y="1" width="238" height="60" rx="6" fill="#FFFFFF" stroke="#B2B2B2" stroke-width="2"/>
	<rect x="3" y="3" width="234" height="14" fill="#5D6D7E"/>
	<rect x="9" y="8" width="26" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.8"/>
	<circle cx="222" cy="10" r="3" fill="#FFFFFF"/>
	<circle cx="231" cy="10" r="3" fill="#FFFFFF"/>
	<rect x="3" y="17" width="234" height="14" fill="#BDCDE8"/>
	<rect x="10" y="19" width="42" height="12" rx="2" fill="#FFFFFF"/>
	<rect x="58" y="21" width="28" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.65"/>
	<rect x="92" y="21" width="28" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.65"/>
	<!-- 面板 1 -->
	<rect x="12" y="34" width="22" height="16" rx="3" fill="#5280C1"/>
	<g fill="#FFFFFF">
		<rect x="17" y="42" width="4" height="6" rx="1"/>
		<rect x="23" y="39" width="4" height="9" rx="1"/>
		<rect x="29" y="37" width="4" height="11" rx="1"/>
	</g>
	<g>
		<rect x="42" y="34" width="10" height="8" rx="2" fill="#5280C1"/>
		<rect x="56" y="36" width="32" height="4" rx="2" fill="#B2B2B2"/>
		<rect x="42" y="45" width="10" height="8" rx="2" fill="#5280C1"/>
		<rect x="56" y="47" width="28" height="4" rx="2" fill="#B2B2B2"/>
	</g>
	<line x1="114" y1="33" x2="114" y2="53" stroke="#B2B2B2" stroke-width="1.5"/>
	<!-- 面板 2 -->
	<rect x="124" y="34" width="22" height="16" rx="3" fill="#5280C1"/>
	<g fill="#FFFFFF">
		<rect x="129" y="37" width="4" height="11" rx="1"/>
		<rect x="135" y="40" width="4" height="8" rx="1"/>
		<rect x="141" y="39" width="4" height="9" rx="1"/>
	</g>
	<g>
		<rect x="154" y="34" width="10" height="8" rx="2" fill="#5280C1"/>
		<rect x="168" y="36" width="32" height="4" rx="2" fill="#B2B2B2"/>
		<rect x="154" y="45" width="10" height="8" rx="2" fill="#5280C1"/>
		<rect x="168" y="47" width="28" height="4" rx="2" fill="#B2B2B2"/>
	</g>
</svg>
