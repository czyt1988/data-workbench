<?xml version="1.0" encoding="utf-8"?>
<!-- 启用图表缩放：放大镜（中灰镜圈 + 白底）+ 镜内蓝色曲线，表示「缩放图表」模式。
     与 zoomIn/zoomOut 共用同一镜身几何。语义对应 UiNames::Action::ChartEnableZoom。
     官方色板：#727272、#5280C1、#B2B2B2、#FFFFFF；禁渐变/阴影/<text>（DESIGN.md §4） -->
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
	<!-- 镜身 -->
	<circle cx="84" cy="84" r="54" fill="#FFFFFF" stroke="#727272" stroke-width="12"/>
	<line x1="124" y1="124" x2="176" y2="176" stroke="#727272" stroke-width="14" stroke-linecap="round"/>
	<!-- 镜内图表：坐标轴 + 上升曲线 -->
	<path d="M54 118V58M54 118H118" fill="none" stroke="#727272" stroke-width="7" stroke-linecap="round"/>
	<path d="M60 108L76 80L92 92L112 62" fill="none" stroke="#5280C1" stroke-width="10"
	      stroke-linecap="round" stroke-linejoin="round"/>
</svg>
