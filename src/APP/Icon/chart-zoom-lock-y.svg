<?xml version="1.0" encoding="utf-8"?>
<!-- 禁止垂直缩放：垂直双向箭头（主蓝）+ 禁止圈（橙红）。语义对应
     UiNames::Action::ChartDisableZoomY。官方色板：#5280C1、#CE6043、#FFFFFF；
     禁渐变/阴影/<text>（DESIGN.md §4） -->
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
	<!-- 垂直双向箭头 -->
	<path fill="#5280C1" d="M106 52v96h18l-38 44-38-44h18V52H48L86 8l38 44h-18z"/>
	<!-- 禁止圈：外圈 + 斜杠 -->
	<path fill="#CE6043" fill-rule="evenodd" d="M44 60a40 40 0 1 0 0 80 40 40 0 0 0 0-80zm0 14a26 26 0 1 1 0 52 26 26 0 0 1 0-52z"/>
	<rect x="9" y="93" width="70" height="14" rx="7" fill="#CE6043" transform="rotate(45 44 100)"/>
</svg>
