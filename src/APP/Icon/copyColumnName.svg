<?xml version="1.0" encoding="utf-8"?>
<!-- 复制列名：左侧表格（列头高亮主蓝，表示被复制的列名）+ 右侧复制页（灰源页 + 蓝目标页）。
     语义对应 UiNames::Action::CopyColumnName。官方色板：#727272、#BDCDE8、#5280C1、
     #B2B2B2、#FFFFFF；禁渐变/阴影/<text>（DESIGN.md §4） -->
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
	<!-- 表格底板 -->
	<rect x="16" y="32" width="112" height="144" rx="8" fill="#FFFFFF" stroke="#727272" stroke-width="8"/>
	<!-- 列头 -->
	<rect x="20" y="36" width="104" height="32" fill="#BDCDE8"/>
	<!-- 被复制的列名（中间列高亮） -->
	<rect x="55" y="36" width="34" height="32" fill="#5280C1"/>
	<!-- 列分隔线 -->
	<g stroke="#727272" stroke-width="6">
		<line x1="55" y1="68" x2="55" y2="168"/>
		<line x1="89" y1="68" x2="89" y2="168"/>
	</g>
	<!-- 行分隔线 -->
	<g stroke="#727272" stroke-width="6">
		<line x1="20" y1="100" x2="124" y2="100"/>
		<line x1="20" y1="132" x2="124" y2="132"/>
	</g>
	<!-- 复制页：灰色源页 + 主蓝目标页 -->
	<rect x="122" y="62" width="58" height="78" rx="6" fill="#727272"/>
	<rect x="138" y="88" width="58" height="78" rx="6" fill="#FFFFFF" stroke="#5280C1" stroke-width="10"/>
	<g stroke="#B2B2B2" stroke-width="6" stroke-linecap="round">
		<line x1="152" y1="112" x2="182" y2="112"/>
		<line x1="152" y1="132" x2="174" y2="132"/>
	</g>
</svg>
