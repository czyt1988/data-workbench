name: Spike / Qt 6.10.3 + MSVC 2022 + Python 3.12 (compile only)

# ==============================================================================
# 目的：在写任何打包逻辑之前，用最小成本先证伪三个假设
#   1) Qt 6.10.3 (msvc2022_64) 能编过当前代码（本地一直用的是 6.7.3/MSVC2019）
#   2) 编译期 Python 3.12 能满足 find_package(Python3 COMPONENTS Development)
#      —— 这是 "Python 3.12+" 需求的真正卡点：exe 直接 import python3XX.dll，
#         ABI 在编译期就定死了，打包阶段再换解释器是无效的
#   3) 10 个 gitee 子模块能全部从 GitHub 镜像拉下来（CI 侧 URL 重写）
#
# 为什么不是 6.11.3 / 6.12.0（已核实，2026-11）：
#   官方 Windows 包清单里 qt6_6113 共 138 个 PackageUpdate、34 个 addon，
#   没有 qtwebengine；6.12.0 同样没有。aqt list-qt 查 6.10.3 有 qtwebengine，
#   6.11.3 起就没了。本项目 DAGui 硬依赖 WebEngine，所以 6.10.3 是可用的最新版。
#   详见：download.qt.io/online/qtsdkrepository/windows_x86/desktop/qt6_<ver>/
#
# 另外 Qt6 的 qt5compat / qtactiveqt / qtmultimedia / qtwebengine 都是独立
# addon 包，不在 qtbase 里——不显式装，配置阶段就会挂在 find_package 上。
#
# 本工作流只编译：不 install、不 windeployqt、不打包、不发 Release。
# 验证通过后它会被真正的 release.yml 取代，不要长期保留。
# ==============================================================================

on:
  workflow_dispatch:
  # 首次推送这个分支就自动跑一轮，省掉"先在页面上点 Run workflow"的一步
  # （workflow_dispatch 要求工作流已存在于默认分支才出现在 UI 里）
  push:
    branches:
      - 'ci/release-spike'

permissions:
  contents: read

env:
  QT_VERSION: '6.10.3'
  PYTHON_VERSION: '3.12'
  # qtbase 只带 Core/Gui/Widgets/Svg/Xml/... 这些基础模块，其余必须显式装。
  # qtwebchannel 单独一条：qtwebengine 不会自动带它，而 DAGui 直接链了 WebChannel
  # qtpositioning 同理：Qt6WebEngineCoreConfig 校验依赖时会要求它
  QT_MODULES: 'qt5compat qtactiveqt qtmultimedia qtpositioning qtwebchannel qtwebengine'

jobs:
  spike:
    name: compile spike
    runs-on: windows-2022
    timeout-minutes: 240

    steps:
      # ------------------------------------------------------------------------
      # 1. CI 侧把 gitee 子模块重写到 GitHub 镜像
      #    - 只写进 runner 的临时全局 .gitconfig，随 job 销毁
      #    - 仓库里的 .gitmodules 与本地开发环境完全不受影响
      #    - 必须放在 checkout 之前：checkout 内部调用的就是 git
      #    - 左侧逐字照抄 .gitmodules（父仓 8 个带 .git、2 个不带）
      #    - 右侧一律【不带】.git：insteadOf 是字符串前缀替换，git 有时会把
      #      .git 补在 URL 上，右侧再带一次就会拼出 `xxx.git.git`（真实踩过）
      #    - 最后一条是 qwt 里嵌套的子模块（examples/bench/chartbench/qim），
      #      只在跑 qwt 示例时用得上，但 submodules: recursive 会一并克隆
      # ------------------------------------------------------------------------
      - name: Rewrite gitee submodules to GitHub mirrors (CI only)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $map = [ordered]@{
            'https://gitee.com/czyt1988/SARibbon.git'                   = 'https://github.com/czyt1988/SARibbon'
            'https://gitee.com/czyt1988/DAWidgets'                      = 'https://github.com/czyt1988/DAWidgets'
            'https://gitee.com/czyt1988/QWT.git'                        = 'https://github.com/czyt1988/QWT'
            'https://gitee.com/czyt1988/quazip.git'                     = 'https://github.com/czyt1988/quazip'
            'https://gitee.com/czyt1988/QtPropertyBrowser.git'          = 'https://github.com/czyt1988/QtPropertyBrowser'
            'https://gitee.com/czyt1988/spdlog.git'                     = 'https://github.com/gabime/spdlog'
            'https://gitee.com/czyt1988/pybind11.git'                   = 'https://github.com/pybind/pybind11'
            'https://gitee.com/czyt1988/zlib'                           = 'https://github.com/madler/zlib'
            'https://gitee.com/czyt1988/ordered-map.git'                = 'https://github.com/Tessil/ordered-map'
            'https://gitee.com/czyt1988/Qt-Advanced-Docking-System.git' = 'https://github.com/githubuser0xFFFF/Qt-Advanced-Docking-System'
            'https://gitee.com/czyt1988/qim.git'                        = 'https://github.com/czyt1988/qim'
          }
          foreach ($k in $map.Keys) {
            git config --global "url.$($map[$k]).insteadOf" $k
            if ($LASTEXITCODE -ne 0) { throw "git config 失败: $k" }
          }
          Write-Host '--- 生效的重写规则 ---'
          git config --global --get-regexp '^url\.'
          if ($LASTEXITCODE -ne 0) { throw '没有任何重写规则生效' }

      # ------------------------------------------------------------------------
      # 2. 检出（含递归子模块）
      # ------------------------------------------------------------------------
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # ------------------------------------------------------------------------
      # 3. 校验：每个子模块都必须真的检出，且远端地址已被改写到 GitHub
      #    —— 重写规则一旦没命中，git 会静默回落到 gitee，这步就是防这个的
      # ------------------------------------------------------------------------
      - name: Verify submodules came from GitHub
        shell: pwsh
        run: |
          $status = git submodule status --recursive
          $status | Write-Host
          # '-' = 未初始化，'+' = 检出的提交与父仓记录不一致，都不能接受
          $bad = $status | Select-String -Pattern '^[+-]'
          if ($bad) {
            Write-Host '::error::有子模块未检出，或检出的提交与父仓记录的不一致'
            exit 1
          }
          Write-Host '--- 各子模块实际会访问的地址（ls-remote --get-url 会解析 insteadOf）---'
          # 注意：不能用 remote.origin.url 判断——它记录的是 .gitmodules 里的原始
          # gitee 地址，URL 重写只发生在传输层，所以那样查永远是 gitee
          $urls = git submodule foreach --recursive "git ls-remote --get-url origin" 2>&1
          $urls | Write-Host
          $gitee = $urls | Select-String 'gitee\.com'
          if ($gitee) {
            Write-Host '::error::仍有子模块实际访问 gitee，重写规则未覆盖'
            exit 1
          }

      # ------------------------------------------------------------------------
      # 4. 工具链
      # ------------------------------------------------------------------------
      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: ${{ env.QT_MODULES }}
          cache: true

      - name: Install Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64

      - name: Report toolchain versions
        shell: pwsh
        run: |
          Write-Host '--- Python ---'
          python -c "import sys,platform; print(sys.version); print(sys.executable); print(platform.machine())"
          Write-Host '--- Python headers/libs（Development 组件的前提）---'
          $root = $env:pythonLocation
          Write-Host "root = $root"
          if (-not (Test-Path "$root\include\Python.h")) { Write-Host '::error::缺少 Python.h' }
          Get-ChildItem "$root\libs\python*.lib" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.Name }
          Write-Host '--- Qt ---'
          & "$env:QT_ROOT_DIR\bin\qmake.exe" -v
          Write-Host '--- MSVC ---'
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property catalog_productDisplayVersion
          Write-Host '--- lupdate（翻译用，本 spike 已关闭翻译）---'
          $lu = Get-Command lupdate -ErrorAction SilentlyContinue
          if ($lu) { Write-Host "found: $($lu.Source)" } else { Write-Host '::warning::没找到 lupdate' }

      # 早失败：WebEngine / addon 模块缺一个，后面 20 分钟的编译都是白跑
      - name: Verify Qt modules really installed
        shell: pwsh
        run: |
          $need = @(
            'bin\Qt6WebEngineCore.dll',
            'bin\Qt6WebEngineWidgets.dll',
            'bin\Qt6WebChannel.dll',
            'bin\Qt6Multimedia.dll',
            'bin\Qt6Core5Compat.dll',
            'lib\Qt6AxContainer.lib',
            'bin\lrelease.exe',
            'bin\windeployqt.exe'
          )
          $missing = @()
          foreach ($n in $need) {
            if (-not (Test-Path (Join-Path $env:QT_ROOT_DIR $n))) { $missing += $n }
          }
          if ($missing.Count -gt 0) {
            Write-Host "::error::Qt 安装缺少: $($missing -join ', ')"
            exit 1
          }
          Write-Host 'Qt 模块齐全（WebEngine / Multimedia / Core5Compat / AxContainer / lrelease）'

      # 20 秒的探针：把主工程要用的整套 Qt 组件一次性 find_package 一遍。
      # 缺哪个依赖它会直接点名，不用等 3rdparty 编完 6 分钟才发现 configure 挂了
      - name: Probe the whole Qt component set
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'qtprobe'
          New-Item -ItemType Directory -Force $probe | Out-Null
          # 注意：这里不能用 here-string——PowerShell 的 '@ 结束符必须顶格，
          # 而 YAML 块标量里顶格就等于跳出块，会把 workflow 写成非法 YAML
          $cmakeLines = @(
            'cmake_minimum_required(VERSION 3.16)',
            'project(qtprobe LANGUAGES CXX)',
            '# 与主工程 CMakeLists 的组件集合一致，外加 DAGui 的 WebEngine 依赖链',
            'find_package(Qt6 REQUIRED COMPONENTS',
            '    Core Gui Widgets Svg Xml PrintSupport Concurrent OpenGL OpenGLWidgets',
            '    Core5Compat AxContainer Network',
            '    WebEngineCore WebEngineWidgets WebChannel Positioning Multimedia',
            '    LinguistTools)',
            'message(STATUS "QT_PROBE_OK")'
          )
          $cmakeLines -join "`n" | Set-Content -Path (Join-Path $probe 'CMakeLists.txt') -Encoding UTF8
          cmake -S $probe -B "$probe\build" -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          if ($LASTEXITCODE -ne 0) { throw 'Qt 组件探针失败：上面列出的就是缺的组件' }

      # ------------------------------------------------------------------------
      # 5. zlib：沿用现有 CI 的 vcpkg 方案（先跑通，缓存优化留到正式工作流）
      # ------------------------------------------------------------------------
      - name: Install zlib via vcpkg
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg bootstrap 失败' }
          .\vcpkg\vcpkg.exe install zlib:x64-windows
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg 安装 zlib 失败' }

      # ------------------------------------------------------------------------
      # 6. 第三方库（安装目录由 CMake 自动算成 bin_Release_qt6.11.3_MSVC_x64）
      # ------------------------------------------------------------------------
      - name: Configure 3rdparty
        shell: pwsh
        run: |
          cmake -S src/3rdparty -B build-3rdparty `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DDA_INSTALL_CONFIG_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw '3rdparty 配置失败' }

      - name: Build 3rdparty
        shell: pwsh
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          cmake --build build-3rdparty --config Release --parallel
          $code = $LASTEXITCODE
          $sw.Stop()
          Write-Host ("::notice::3rdparty 编译耗时 {0:N1} 分钟" -f $sw.Elapsed.TotalMinutes)
          if ($code -ne 0) { exit $code }

      - name: Install 3rdparty
        shell: pwsh
        run: |
          cmake --install build-3rdparty --config Release
          if ($LASTEXITCODE -ne 0) { throw '3rdparty 安装失败' }

      # ------------------------------------------------------------------------
      # 7. 主工程：这一步就是整场 spike 的答案
      #    -DPython3_EXECUTABLE 显式指向 3.12，否则 find_package(Python3)
      #    很可能摸到 runner 上的其它解释器，测出来的就不是我们要的 ABI
      #    翻译保持开启（lrelease/lupdate 在 qtbase/bin 里，和本地一致），
      #    这样测的是真实发版路径，而不是一条被削过的路径
      # ------------------------------------------------------------------------
      - name: Configure main project
        shell: pwsh
        run: |
          if (-not $env:pythonLocation) { throw 'pythonLocation 未设置' }
          cmake -S . -B build `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DDA_INSTALL_CONFIG_TYPE=Release `
            -DDA_ENABLE_TESTING=OFF `
            -DPython3_EXECUTABLE="$env:pythonLocation\python.exe"
          if ($LASTEXITCODE -ne 0) { throw '主工程配置失败' }

      - name: Verify linked Python ABI
        shell: pwsh
        run: |
          Write-Host '--- CMake 实际选中的 Python ---'
          Select-String -Path build\CMakeCache.txt -Pattern '^Python3_[A-Z_]+:' |
            ForEach-Object { Write-Host ($_.Line -replace '^\d{4}-\d\d-\d\dT[\d:.]+Z ', '') }
          # 不同 CMake 版本存的变量名不一样（Python3_LIBRARY / Python3_LIBRARY_RELEASE），
          # 所以别认变量名，直接在缓存里找 "python3XX.lib" 这个具体文件名。
          # 注意拼串：版本号 "3.12" 去掉点就是 "312"，前缀是 "python" 不是 "python3"
          $digits = $env:PYTHON_VERSION -replace '\.', ''
          $pattern = "python$digits\.lib"
          $hit = Select-String -Path build\CMakeCache.txt -Pattern $pattern
          if (-not $hit) {
            Write-Host "::error::CMakeCache 里找不到 $pattern，Python ABI 没切过去"
            exit 1
          }
          Write-Host "已确认链接 $pattern"

      - name: Build main project
        shell: pwsh
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          cmake --build build --config Release --parallel
          $code = $LASTEXITCODE
          $sw.Stop()
          Write-Host ("::notice::主工程编译耗时 {0:N1} 分钟，exit={1}" -f $sw.Elapsed.TotalMinutes, $code)
          if ($code -ne 0) { exit $code }

      # ------------------------------------------------------------------------
      # 8. 结果：确认产物存在，并打印实际依赖的 Python DLL
      # ------------------------------------------------------------------------
      - name: Report result
        if: always()
        shell: pwsh
        run: |
          $exe = 'build\bin\Release\DAWorkBench.exe'
          if (-not (Test-Path $exe)) {
            Write-Host '::warning::没有产出 DAWorkBench.exe（编译未通过）'
            exit 0
          }
          $f = Get-Item $exe
          Write-Host "::notice::产物 $exe  $([math]::Round($f.Length/1MB,2)) MB"

          # dumpbin 不在普通 shell 的 PATH 里。注意两种取法的属性名不同：
          # Get-Command 返回 CommandInfo（用 .Source），Get-ChildItem 返回
          # FileInfo（用 .FullName）——混用会拿到 null，然后 & $null 直接报错
          $dumpbinPath = $null
          $cmd = Get-Command dumpbin.exe -ErrorAction SilentlyContinue
          if ($cmd) {
            $dumpbinPath = $cmd.Source
          } else {
            $fi = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio\2022\*\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($fi) { $dumpbinPath = $fi.FullName }
          }
          if ($dumpbinPath) {
            Write-Host '--- exe 依赖里的 python / MSVC 运行时 ---'
            & $dumpbinPath /dependents $exe | Select-String 'python|MSVCP|VCRUNTIME'
            Write-Host '--- 构建产物目录里的运行库 ---'
            Get-ChildItem 'build\bin\Release\*.dll' -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match 'python|MSVCP|VCRUNTIME|zd\.dll|zlib1' } |
              ForEach-Object { Write-Host "  $($_.Name)" }
          } else {
            Write-Host '::warning::没找到 dumpbin，跳过依赖检查'
          }

          # 冒烟只作参考：构建树的 Qt DLL 尚未部署，缺 DLL 属预期。
          # 必须带超时——GUI 子系统程序在 CI 里万一弹窗/等事件循环就会挂死整条流水线
          Write-Host '--- 尝试 --version（缺 DLL 属预期，且不据此判失败）---'
          $outFile = Join-Path $env:RUNNER_TEMP 'exe-version.out'
          $errFile = Join-Path $env:RUNNER_TEMP 'exe-version.err'
          $proc = Start-Process -FilePath $exe -ArgumentList '--version' -NoNewWindow -PassThru `
            -RedirectStandardOutput $outFile -RedirectStandardError $errFile
          if (-not $proc.WaitForExit(30000)) {
            $proc.Kill()
            Write-Host '::warning::--version 30 秒未退出，已强制结束'
          } else {
            Write-Host "exit=$($proc.ExitCode)"
            if (Test-Path $outFile) { Get-Content $outFile | ForEach-Object { Write-Host $_ } }
            if (Test-Path $errFile) { Get-Content $errFile | ForEach-Object { Write-Host $_ } }
          }
          exit 0
