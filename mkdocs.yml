site_name: DAWorkBench
site_author: 'Chen ZongYan'
site_description: '基于工作流数据的分析工具 - 开发与使用指南'
use_directory_urls: true

# 主题
theme:
  name: material
  logo: assets/icon.png
  favicon: assets/icon.ico
  language: zh
  palette:
    - scheme: default
      primary: blue
      toggle:
        icon: material/brightness-4
        name: 切换深色
    - scheme: slate
      primary: blue
      toggle:
        icon: material/brightness-7
        name: 切换浅色
  features:
    - navigation.tabs          # 一级导航显示为顶部水平标签栏，左侧只显示当前 Tab 的子项
    - navigation.tabs.sticky   # 滚动时顶部标签栏保持可见
    - navigation.sections
    - navigation.top
    - navigation.path
    - navigation.expand
    - navigation.indexes
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow

plugins:
  - i18n:
      languages:
        - locale: zh
          name: 中文
          default: true
  - search
  - mermaid2

# 导航 - 顶部 Tab = 一级分类，左侧导航只显示当前 Tab 的子项（2026-08 文档重组后）
