          - API 文档索引: zh/reference/api-reference.md
          - Doxygen 首页: doxygen/index.html
          - 类索引: doxygen/classes.html
          - 文件列表: doxygen/files.html
      - 更新日志: zh/reference/changelog.md

markdown_extensions:
  - meta
  - abbr
  - attr_list
  - def_list
  - footnotes
  - tables
  - md_in_html
  - toc:
      permalink: true
  - fenced_code
  - nl2br
  - admonition
  - pymdownx.highlight:
      linenums: true
      linenums_style: table
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
  - pymdownx.arithmatex:
      generic: true
      smart_dollar: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - js/mermaid.min.js
  - js/katex.min.js
  - js/auto-render.min.js
  - js/katex-init.js

extra_css:
  - stylesheets/extra.css
  - css/extra.css
  - css/katex.min.css
  - stylesheets/home.css   # 落地页样式，放最后以覆盖全局 h2 等通用样式