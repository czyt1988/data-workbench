<?xml version="1.0" encoding="utf-8"?>
<!-- 导出到单个 Excel：左侧两个浅蓝数据页 → 主蓝导出箭头 → 右侧 Excel 工作簿（保留 Excel 绿）。
     语义对应 actionExportToOneExcel。Excel 绿 #37812E 为品牌色例外（DESIGN.md §2.4），
     其余取官方色板 #BDCDE8、#5280C1、#FFFFFF；禁渐变/阴影/<text> -->
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
	<!-- 数据页（两个待合并的数据源） -->
	<rect x="18" y="40" width="44" height="52" rx="5" fill="#BDCDE8" stroke="#5280C1" stroke-width="6"/>
	<rect x="34" y="64" width="44" height="52" rx="5" fill="#FFFFFF" stroke="#5280C1" stroke-width="6"/>
	<!-- 导出箭头 -->
	<line x1="88" y1="92" x2="106" y2="92" stroke="#5280C1" stroke-width="10" stroke-linecap="round"/>
	<polygon points="104,76 130,92 104,108" fill="#5280C1"/>
	<!-- Excel 工作簿 -->
	<rect x="120" y="32" width="66" height="136" rx="8" fill="#37812E"/>
	<path d="M138 78L168 114M168 78L138 114" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
</svg>
